[project]
name = "anon-pcap"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"

[dependency-groups]
dev = [
    "black==25.11",
    "ruff==0.15.20",
    "mypy==1.19",
]

[tool.black]
line-length = 140
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
warn_unreachable = true
pretty = true
exclude = '^\.venv/'

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"] # isort, pyupgrade, bugbear
