[package]
name = "bip324-decryptor"
version = "0.1.0"
edition = "2024"

[dependencies]
bip324_mitm = { git = "https://github.com/RazorBest/bip324-mitm.git" }
slapp = { git = "https://github.com/RazorBest/slapp-rs" }
chrono = "0.4.45"
clap = { version = "4.6.6", features = ["derive"] }
ctrlc = "3.5.2"
etherparse = "0.21.0"
libc = "0.2.191"
pcap-file = "2.0.0"
rtrb = "0.3.4"
rand = { version = "0.8.0" }
ringbuf = "0.5.1"
secp256k1 = { version = "0.29.0", features = ["rand", "std"] }
time = { version = "0.3.55", features = ["macros"] }
tokio = { version = "1.54.1", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "time"] }
tracing-appender = "0.2.5"
